services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: ai-terminal-backend
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - ai-terminal-network
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: ai-terminal-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-terminal-network
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ai-terminal-network:
    driver: bridge
